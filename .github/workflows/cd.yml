name: CD
on:
  push:
    branches: [main]
    paths: ["src/**", "app/**", "artifacts/**", "Dockerfile.*", "pyproject.toml"]
  workflow_run:              # dopo ogni retrain riuscito -> nuova immagine col nuovo modello
    workflows: ["Weekly training"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix: { component: [api, app] }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }  # include il commit del modello appena allenato

      - name: Nome immagine in minuscolo (Docker non accetta maiuscole)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.component }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook (immagine esatta di questo commit)
        env:
          API_HOOK: ${{ secrets.DEPLOY_HOOK_API }}
          APP_HOOK: ${{ secrets.DEPLOY_HOOK_APP }}   # opzionale
        run: |
          deploy() {  # $1 = hook URL, $2 = componente (api|app)
            [ -z "$1" ] && { echo "hook $2 non impostato: skip"; return 0; }
            img="ghcr.io/${GITHUB_REPOSITORY,,}-$2:${GITHUB_SHA}"
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$img")
            curl -fsS -X POST "$1&imgURL=$enc" && echo " -> deploy $2 avviato con $img"
          }
          deploy "$API_HOOK" api
          deploy "$APP_HOOK" app
