name: Weekly training
on:
  schedule:
    - cron: "0 5 * * 1"     # ogni lunedì 05:00 UTC
  workflow_dispatch:         # avvio manuale dal tab Actions
    inputs:
      tickers: { description: "Ticker (comma-separated)", required: false }
      period:  { description: "Periodo Yahoo (es. 5y, 10y)", required: false }

permissions:
  contents: write            # serve per committare leaderboard e modello

concurrency: { group: training, cancel-in-progress: false }

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Train 5 models + leaderboard
        env:
          STOCKML_TICKERS: ${{ inputs.tickers || vars.STOCKML_TICKERS || 'SPY,QQQ,AAPL,MSFT,NVDA' }}
          STOCKML_PERIOD:  ${{ inputs.period  || vars.STOCKML_PERIOD  || '5y' }}
        run: stockml-train
      - name: Job summary
        run: cat LEADERBOARD.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_number }}
          path: artifacts/
          retention-days: 90
      - name: Commit leaderboard & model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ LEADERBOARD.md README.md
          git diff --cached --quiet || git commit -m "chore(model): weekly retrain $(date -u +%F)"
          git push
