[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockml"
version = "0.1.0"
description = "Yahoo Finance -> 5 ML models -> leaderboard -> FastAPI -> Streamlit"
requires-python = ">=3.10"
dependencies = [
  "yfinance>=0.2.40",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "tabulate>=0.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
app = ["streamlit>=1.35", "requests>=2.31", "plotly>=5.20"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
stockml-train = "stockml.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"] 

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
